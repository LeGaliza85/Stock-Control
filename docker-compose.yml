services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: stock_control
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_control_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: stock_control-app
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - db
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
      - data:/data
      - bash_history:/root
    ports:
      - "3000:3000"
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"

volumes:
  bundle_data:
  data:
  bash_history:
  postgres_data:
